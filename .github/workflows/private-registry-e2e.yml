# SMI-5922 -- private registry install staging e2e round-trip.
# Proves the full publish -> fetch (Edge Function / MCP-live) -> install (real CLI
# subprocess) -> boundary-outcome path against staging Supabase
# (ovhcifugwqnzoebwfuku -- never prod). Third sibling in the e2e-staging
# GitHub Environment, alongside device-login-roundtrip.yml and
# cross-harness-inventory-e2e.yml.
#
# Hard gate: "green" means the guard step's step-summary line reads
# "spec PASSED (exit_code=0)" (and, equivalently, `steps.spec.outputs.exit_code
# == '0'`) -- NOT the job conclusion, and NOT the spec step's color alone. The
# spec step carries its OWN `continue-on-error: true` (SMI-5965 -- moved off the
# job level, see below), so a spec failure never turns the job/run red during
# Phase 1; the guard's step-summary + `::warning::` annotation are the only
# trust anchors that can't be laundered by a masked step result.
#
# Phase 1 rollout: PR + dispatch (+ nightly post-merge) run with the SPEC STEP
# ONLY carrying `continue-on-error: true` (SMI-5965 -- previously job-level,
# which also masked every infra step ahead of it; now only the spec is masked,
# so a migration-drift/container-boot/dist-verify failure genuinely fails the
# run). Promotion (SMI-5922 Wave 4): remove the spec step's continue-on-error,
# wire an alert-notify failure step, add to required checks after 10
# consecutive green nightly runs (cancelled runs don't count). Unlike the
# inventory/device-login siblings there is no blocked prod rollout waiting on
# this (the feature is already live) -- promotion is purely so future
# regressions block merges.
#
# Docker (deliberate departure from the sibling workflows -- SMI-5922 plan
# review finding #4): the spec now invokes the REAL `skillsmith registry
# install` CLI subprocess, which loads better-sqlite3 via openCliDatabase() --
# a native module, so it needs glibc (ADR-002) and this repo's Docker-first
# execution model. Only the spec step itself runs in Docker; everything else
# (checkout, drift preflight, cleanup, guard step) stays on the bare runner,
# matching this repo's default Docker-first model without pulling in the full
# CI docker-build/cache pipeline (ci.yml) -- this is a nightly + path-triggered
# workflow, not the main per-push gate, so a plain `docker compose up` cold
# build is an acceptable trade for staying self-contained.
#
# H3 (borrowed from the sibling workflows): prod-ref grep gate is scoped to the
# UNENCRYPTED surface only. Do NOT add supabase/migrations/** or
# supabase/functions/** -- grep reads ciphertext there and would false-alarm.

name: Private Registry Install E2E

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily -- offset from device-login (06:00) and inventory (06:30)
  workflow_dispatch: {}
  pull_request:
    paths:
      # GPT-5.6-Sol review finding #7: the original filter named only one file per
      # transport (registry-install.action.ts, the two top-level spec/seed scripts),
      # so a PR touching the commander factory, a companion file, CLI DB/credential
      # primitives, or package metadata alone would not trigger this workflow.
      - 'packages/core/src/api/client.private-registry.ts'
      - 'packages/core/src/api/client.token-refresh.ts'
      - 'packages/core/src/config/token-credentials.ts'
      - 'packages/core/src/install/paths.ts'
      - 'packages/core/src/services/skill-installation.content.ts'
      - 'packages/cli/src/commands/registry-install.*'
      - 'packages/cli/src/utils/open-database.ts'
      - 'packages/cli/package.json'
      - 'packages/mcp-server/src/tools/registry-tools.live.*'
      - 'packages/mcp-server/src/tools/registry-tools.ts'
      - 'packages/mcp-server/src/tools/team-resolver.ts'
      - 'supabase/functions/private-registry-get/**'
      - 'supabase/migrations/20260724000000_private_registry_skills.sql'
      - 'supabase/migrations/20260727000000_private_registry_skill_namespace_enforcement.sql'
      - 'supabase/migrations/20260729000000_private_registry_privilege_hardening.sql'
      - 'supabase/migrations/20260729000001_private_registry_hardening_backfill.sql'
      - 'scripts/seed-e2e-registry-users.ts'
      - 'scripts/seed-e2e-registry-users.helpers.ts'
      - 'scripts/e2e-registry-roundtrip.ts'
      - 'scripts/e2e-registry-roundtrip.helpers.ts'
      - 'scripts/e2e-registry-roundtrip.mcp-live.ts'
      - 'scripts/e2e-registry-roundtrip.types.ts'
      - '.github/workflows/private-registry-e2e.yml'
      # SMI-5957: this is the only workflow doing a cold `docker compose up`
      # (no cached CI docker-build pipeline) -- a future change to any of
      # these three files gets no pre-merge signal from this workflow
      # without this. This gap is exactly how SMI-5957 itself went
      # unnoticed for 5 days (10/10 executed runs failing, masked by
      # continue-on-error) and how the underlying BUILD_FILTER regression
      # (SMI-5548) shipped silently.
      - 'docker-entrypoint.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'

concurrency:
  group: private-registry-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (prod-ref grep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refuse if prod project ref present in registry e2e surface (non-negotiable)
        run: |
          set -eu
          # Prod ref must not appear in the registry e2e surface EXCEPT on lines
          # bearing the explicit allowlist marker `SMI-5922-allow-prod-ref` (used
          # in scripts/seed-e2e-registry-users.ts and scripts/e2e-registry-roundtrip.ts's
          # own refuse-on-match guards -- the very thing this gate protects). Any
          # other occurrence is presumed to be an accidentally-pasted prod URL.
          # The needle is split across two parts so the literal never appears
          # contiguously in this file (avoids the gate matching its own source).
          # Grep ONLY the unencrypted surface -- NOT supabase/migrations/**,
          # NOT supabase/functions/** (grep reads ciphertext and false-alarms).
          # SMI-5922-allow-prod-ref-needle.
          NEEDLE="vrcnzpmnd""troqxxoqkzy"
          MATCHES="$(grep -rEn "$NEEDLE" \
             scripts/seed-e2e-registry-users.ts \
             scripts/seed-e2e-registry-users.helpers.ts \
             scripts/e2e-registry-roundtrip.ts \
             scripts/e2e-registry-roundtrip.helpers.ts \
             scripts/e2e-registry-roundtrip.mcp-live.ts \
             scripts/e2e-registry-roundtrip.types.ts \
             .github/workflows/private-registry-e2e.yml \
             | grep -vE 'SMI-5922-allow-prod-ref' || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Prod project ref detected in registry e2e surface -- refusing to run"
            echo "$MATCHES"
            exit 1
          fi
          echo "Prod-ref grep gate clean."

  test:
    name: Private registry round-trip test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e-staging
    permissions:
      contents: read
    # Dependabot PRs are same-repo but receive no repository secrets (SMI-5485).
    # Event-scoped (not a bare actor check): on `schedule`, github.actor is
    # attributed to the last workflow editor, which can be dependabot[bot] after
    # a merged github-actions bump -- a bare check would silently skip the
    # nightly burn-in run. This form only excludes dependabot *PRs*.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_REG_ADMIN_USER_ID: ${{ secrets.E2E_REG_ADMIN_USER_ID }}
      E2E_REG_MEMBER_USER_ID: ${{ secrets.E2E_REG_MEMBER_USER_ID }}
      E2E_REG_NONENT_USER_ID: ${{ secrets.E2E_REG_NONENT_USER_ID }}
      E2E_REG_DUAL_USER_ID: ${{ secrets.E2E_REG_DUAL_USER_ID }}
      E2E_REG_USER_PASSWORD: ${{ secrets.E2E_REG_USER_PASSWORD }}
      E2E_REG_TEAM_A_LICENSE_KEY: ${{ secrets.E2E_REG_TEAM_A_LICENSE_KEY }}
      E2E_REG_TEAM_B_LICENSE_KEY: ${{ secrets.E2E_REG_TEAM_B_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Migration drift preflight (private-registry hardening objects must exist)
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -eu
          REF="$(printf '%s' "$STAGING_SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')"
          if [ -z "$REF" ]; then
            echo "::error::Could not derive project ref from STAGING_SUPABASE_URL"; exit 1
          fi
          # Fail-closed runtime ref guard (defense-in-depth beyond the file-content
          # grep gate): refuse to connect unless the derived ref is staging.
          if [ "$REF" != "ovhcifugwqnzoebwfuku" ]; then
            echo "::error::derived project ref '${REF}' is not the staging ref -- refusing to connect"; exit 1
          fi
          # Assert exact count == 5 (a half-applied migration state must fail):
          # private_registry_content_hash, enforce_private_registry_content_hash
          # (20260729000000), derive_team_skill_namespace,
          # prevent_skill_namespace_mutation, enforce_private_skill_namespace
          # (20260727000000). Transaction pooler (port 6543) for a short read.
          CONN="host=aws-1-us-east-1.pooler.supabase.com port=6543 dbname=postgres user=postgres.${REF} sslmode=require connect_timeout=15"
          QUERY="SELECT count(*) FROM pg_proc WHERE proname IN ('private_registry_content_hash','enforce_private_registry_content_hash','derive_team_skill_namespace','prevent_skill_namespace_mutation','enforce_private_skill_namespace');"
          COUNT=""
          for attempt in 1 2 3; do
            if COUNT="$(printf '%s' "$QUERY" | psql "$CONN" -P pager=off -At)"; then
              break
            fi
            COUNT=""
            if [ "$attempt" -lt 3 ]; then
              echo "drift preflight: psql attempt ${attempt} could not connect; retrying in 10s..." >&2
              sleep 10
            else
              echo "drift preflight: psql attempt ${attempt} could not connect; no more retries." >&2
            fi
          done
          if [ -z "$COUNT" ]; then
            echo "::error::staging pooler unreachable after 3 attempts (transient pooler/network timeout on port 6543) -- NOT migration drift; re-run the workflow."
            exit 1
          fi
          if [ "$COUNT" != "5" ]; then
            echo "::error::staging migration drift detected: expected exactly 5 private-registry hardening procs, got ${COUNT}. Apply migrations via supabase db push --db-url (never --linked)."
            exit 1
          fi
          echo "Migration drift preflight clean (5 private-registry hardening procs confirmed)."

      - name: Start dev container
        run: docker compose --profile dev up -d

      - name: Wait for dev container ready (entrypoint build complete)
        run: |
          set -eu
          # SMI-5957 correction #4 (from live evidence -- the unconditional
          # "Dump entrypoint build log" step below): docker-compose.yml's
          # healthcheck is `node -e "console.log('healthy')"`, which the
          # Docker daemon runs as an INDEPENDENT `docker exec` probe on its
          # own interval -- it has never been coupled to whether the
          # entrypoint script (the container's PID 1) has finished its own
          # build. A live CI run's diagnostic dump captured the entrypoint's
          # log cut off mid-`tsc` on the FIRST of 4 packages at the exact
          # instant this step (in its prior Health.Status-polling form)
          # already reported healthy and let the next step ("Verify
          # workspace dist/") run -- i.e. every prior correction (#1-#3)
          # fixed a real build-reliability bug, but none of them fixed this
          # step trusting a health signal that was never actually gated on
          # the build. Poll for the entrypoint's own "dist/ outputs ready"
          # log line instead -- printed unconditionally after its dist/
          # check succeeds, whether it just built (cold start) or found
          # dist/ already present (skip-build path) -- which is the actual
          # condition this step (and the next one) needs, not a proxy for
          # it. 300s (60 x 5s) budget unchanged.
          for i in $(seq 1 60); do
            if docker logs skillsmith-dev-1 2>&1 | grep -q 'dist/ outputs ready'; then
              echo "Entrypoint build complete (dist/ outputs ready)."
              exit 0
            fi
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' skillsmith-dev-1 2>/dev/null || echo starting)"
            echo "Entrypoint build not yet complete (container status: ${STATUS}, attempt ${i}/60)"
            sleep 5
          done
          echo "::error::skillsmith-dev-1's entrypoint did not finish its dist/ build in time"
          echo "--- Restart/exit diagnostics ---"
          RESTARTS="$(docker inspect --format='{{.RestartCount}}' skillsmith-dev-1 2>/dev/null || echo unknown)"
          EXITCODE="$(docker inspect --format='{{.State.ExitCode}}' skillsmith-dev-1 2>/dev/null || echo unknown)"
          echo "RestartCount=${RESTARTS} ExitCode=${EXITCODE}"
          if [ "${RESTARTS}" != "unknown" ] && [ "${RESTARTS}" -gt 2 ] 2>/dev/null; then
            echo "::warning::RestartCount>2 -- likely a crash-restart loop (deterministic failure), not a slow start. See docker logs below."
          fi
          docker logs skillsmith-dev-1 || true
          exit 1

      - name: Dump entrypoint build log (diagnostic, always runs -- SMI-5957)
        # Unconditional (not just on healthcheck failure): correction #3's
        # failure happened AFTER the container reported healthy, so the
        # prior step's own conditional log dump never fires for it. This
        # gives direct visibility into what the entrypoint's own
        # `npx turbo run build --force ...` actually did/printed, instead
        # of inferring it from dist/'s post-hoc file state.
        if: always()
        run: docker logs skillsmith-dev-1 2>&1 | sed -n '/Checking dist. outputs/,/dist. outputs ready/p' || true

      - name: Verify workspace dist/ (built by the entrypoint, not rebuilt here)
        run: |
          # SMI-5957 (superseding this step's original design): docker-compose.yml's
          # `.:/app` bind mount replaces the image's baked /app at container start
          # with this fresh checkout, which has no dist/ (gitignored) -- only root
          # node_modules survives, via its own named volume. The container's own
          # entrypoint (docker-entrypoint.sh) now builds @skillsmith/core,
          # @skillsmith/mcp-server, @skillsmith/doc-retrieval-mcp, AND
          # @skillsmith/cli together in ONE turbo invocation before the container
          # ever reports healthy -- this step no longer builds anything itself,
          # it only verifies that happened, and fails loudly (not with a
          # confusing downstream "command not found") if it somehow didn't.
          #
          # This step used to run a SECOND, separate build here (first an
          # unscoped `npm run build`, later a scoped one) -- removed entirely
          # after live CI verification (not local repro alone; a genuine gap
          # between this session's local Docker environment and a real
          # GH-hosted Linux runner) found a second, separate build invocation
          # in the same container is unreliable two independent ways: (1)
          # mcp-server's composite/incremental tsconfig with a TS project
          # reference to core makes a SECOND `tsc` invocation against
          # mcp-server incorrectly report a real-looking zod type error
          # (SMI-5960, a genuinely pre-existing TS incremental-compile bug);
          # (2) a separately-invoked `docker exec` process failed to resolve
          # `@skillsmith/core` as a module even though its dist/ was already
          # present and correct, on a real CI runner (never reproduced
          # locally). Building everything in the entrypoint's own single
          # invocation sidesteps both, rather than working around either.
          docker exec skillsmith-dev-1 sh -c '
            set -eu
            missing=0
            for f in packages/core/dist/src/index.js packages/mcp-server/dist/src/index.js packages/doc-retrieval-mcp/dist/src/server.js packages/cli/dist/cli.js; do
              if [ ! -f "$f" ]; then
                echo "::error::$f missing -- the entrypoint build did not produce it."
                missing=1
              fi
            done
            if [ "$missing" -eq 1 ]; then
              echo "--- diagnostics: entrypoint build/turbo state ---"
              echo "node_modules/.bin/turbo: $(ls -la node_modules/.bin/turbo 2>&1)"
              echo "packages/core/dist/ contents:"; ls -la packages/core/dist/ 2>&1 || echo "  (dist/ dir itself absent)"
              echo "packages/core/dist/.tsbuildinfo mtime: $(stat -c "%y" packages/core/dist/.tsbuildinfo 2>&1 || echo absent)"
              exit 1
            fi
            echo "All required dist/ outputs present."
          '

      - name: Run private registry round-trip spec
        id: spec
        # Exit-code capture is EXPLICIT -- no pipe, no pipefail reliance (SMI-5965).
        # The prior form piped through `| tee` under the DEFAULT run: shell, which is
        # `bash -e {0}` (see any step's own `shell:` line in a live job log) -- NOT the
        # pipefail form `bash --noprofile --norc -eo pipefail {0}`, which GitHub applies
        # ONLY when `shell: bash` is written explicitly. tee's exit 0 therefore became
        # the step result while the spec had exited 2 (runs 31342225994/31343943821).
        continue-on-error: true # audit:allow-continue-on-error -- Phase-1 spec-only masking (SMI-5965)
        run: |
          mkdir -p test-results
          set +e
          docker exec \
            -e STAGING_SUPABASE_URL \
            -e STAGING_SUPABASE_ANON_KEY \
            -e STAGING_SUPABASE_SERVICE_ROLE_KEY \
            -e E2E_REG_ADMIN_USER_ID \
            -e E2E_REG_MEMBER_USER_ID \
            -e E2E_REG_NONENT_USER_ID \
            -e E2E_REG_DUAL_USER_ID \
            -e E2E_REG_USER_PASSWORD \
            -e E2E_REG_TEAM_A_LICENSE_KEY \
            -e E2E_REG_TEAM_B_LICENSE_KEY \
            -e GITHUB_RUN_ID \
            skillsmith-dev-1 npx tsx scripts/e2e-registry-roundtrip.ts \
            > test-results/registry-roundtrip.log 2>&1
          SPEC_EXIT=$?
          printf 'exit_code=%s\n' "${SPEC_EXIT}" >> "$GITHUB_OUTPUT"
          set -e
          cat test-results/registry-roundtrip.log || true
          echo "spec exit code: ${SPEC_EXIT}"
          exit "${SPEC_EXIT}"

      - name: Surface real e2e result (Phase-1 invisible-success guard)
        # Reads the spec step's EXPLICIT exit_code output (not just outcome) so the
        # guard can never be fooled by a laundered pipe exit code the way the
        # pre-SMI-5965 `| tee` form was (runs 31342225994/31343943821 -- both green
        # at every level while the spec had actually exited 2). Advisory, not
        # enforcing: a missing/non-zero exit_code or non-success outcome always
        # renders as FAILED (fail-closed on absence), but this step itself still
        # exits 0 and never turns the job/run red on its own -- that's the Phase-1
        # contract, promoted away only in SMI-5922 Wave 4. Cancelled/timed-out runs
        # correctly read as FAILED here (empty exit_code != "0") but are excluded
        # from the Wave 4 ten-consecutive-green-nightlies promotion count; if the
        # runner is killed outright, neither this step nor the spec's own output
        # write can run at all -- an unavoidable limit of any in-job signal.
        if: always()
        env:
          SPEC_EXIT: ${{ steps.spec.outputs.exit_code }}
          SPEC_OUTCOME: ${{ steps.spec.outcome }}
        run: |
          if [ "${SPEC_EXIT}" = "0" ] && [ "${SPEC_OUTCOME}" = "success" ]; then
            echo "### Private Registry E2E -- spec PASSED (exit_code=0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Private Registry E2E spec FAILED::spec exit_code='${SPEC_EXIT:-<missing>}' outcome=${SPEC_OUTCOME}. The spec step is continue-on-error during Phase 1 -- do NOT treat this run as a passing gate. Inspect the spec step + uploaded artifacts."
            echo "### Private Registry E2E -- spec FAILED (exit_code='${SPEC_EXIT:-<missing>}', outcome=${SPEC_OUTCOME}), masked by Phase-1 continue-on-error" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts on spec failure (allowlisted paths only -- no secrets)
        if: steps.spec.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: private-registry-e2e-${{ github.run_id }}
          path: |
            test-results/registry-*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop dev container
        if: always()
        run: docker compose --profile dev down || true

      - name: Defensive cleanup (run-scoped + age-scoped, team_id-bound)
        # Always team_id-scoped to the two seeded test teams -- a bare skill_id
        # LIKE pattern alone (run-scoped or age-scoped) could otherwise match a
        # real staging row whose name happens to collide with the predictable
        # test pattern. The durable Team B skill (no run_id, meant to persist) is
        # excluded by construction -- neither LIKE pattern below matches its
        # exact skill_id (it has no 'e2e-reg-<digits/local->' suffix segment).
        if: always()
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -eu
          REF="$(printf '%s' "$STAGING_SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')"
          if [ "$REF" != "ovhcifugwqnzoebwfuku" ]; then
            echo "::warning::derived project ref '${REF}' is not staging -- skipping defensive cleanup"; exit 0
          fi
          CONN="host=aws-1-us-east-1.pooler.supabase.com port=6543 dbname=postgres user=postgres.${REF} sslmode=require connect_timeout=15"
          cat <<'SQL' | psql "$CONN" -P pager=off -At || true
          DELETE FROM private_registry_skills
            WHERE skill_id LIKE '%/e2e-reg-${{ github.run_id }}%'
              AND team_id IN (
                SELECT id FROM teams WHERE subscription_id IN ('e2e-reg-ent-sub', 'e2e-reg-nonent-sub')
              );
          DELETE FROM private_registry_skills
            WHERE skill_id LIKE '%/e2e-reg-%'
              AND skill_id NOT LIKE '%/durable-skill'
              AND created_at < now() - interval '1 day'
              AND team_id IN (
                SELECT id FROM teams WHERE subscription_id IN ('e2e-reg-ent-sub', 'e2e-reg-nonent-sub')
              );
          SQL

      # Phase-1 failure visibility is the GitHub Actions tab: a red nightly run
      # plus the PR annotation. An alert-notify failure step is intentionally NOT
      # added while `continue-on-error: true` is in effect -- see the sibling
      # workflows' identical rationale. Wired as part of the SMI-5922 Wave 4
      # promotion (10 consecutive green nightlies), when continue-on-error is
      # removed and the job becomes a required check.
