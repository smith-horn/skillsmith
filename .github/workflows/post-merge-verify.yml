name: Post-Merge Verify

# Runs host-equivalent typecheck + root-vitest config after every push to main,
# catching config drift (e.g. integration-test types, root vitest exclusions)
# that the PR matrix does not exercise.
#
# SMI-4220: This workflow runs natively on ubuntu-latest, not inside Docker.
# ADR-002 (Docker-first) applies to package builds and developer workflows;
# this CI observer runs natively because the runner environment is
# reproducible, and adding Docker would roughly double runtime for a
# non-gating job.
# SMI-4239 / SMI-5547: `npm ci --ignore-scripts` keeps supply-chain hygiene
# (repo .npmrc sets ignore-scripts=true, SMI-4672/4673), so it does NOT build
# native bindings. The colocated package tests in vitest.config.root-tests.ts
# load better-sqlite3 via new Database() / createTestDatabase(), so the
# dedicated "Rebuild native modules" step below runs `npm rebuild
# better-sqlite3 --ignore-scripts=false` plus a probe to provide a working
# host binding before the root vitest step. If a NEW native module enters
# the root-runner's dep tree, add it to that rebuild step (it must ship a
# linux-x64 / Node 22 prebuilt).
#
# See docs/internal/implementation/smi-4210-4212-ci-safety-net.md (SMI-4211).
#
# Rollback: rename this file to `post-merge-verify.yml.disabled` or set
# `if: false` on the `verify` job. Close any open auto-issues manually.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
      - '.claude/**'

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Ensure auto-issue labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --color B60205 --description "Automated CI failure report" 2>/dev/null || true
          gh label create post-merge-verify --color FBCA04 --description "Post-merge verification observer" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (better-sqlite3)
        run: |
          npm rebuild better-sqlite3 --ignore-scripts=false
          node -e "const D=require('better-sqlite3'); const d=new D(':memory:'); d.close(); console.log('better-sqlite3 OK')"

      - name: Typecheck (full workspace)
        run: npm run typecheck

      - name: Build core + doc-retrieval-mcp (SMI-5984)
        # SMI-5984: mcp-disconnect-state.test.ts (SMI-5941) spawns the compiled
        # dist/src/_lib/mcp-disconnect-worker.js — without a build step it never
        # exists and the test times out (10s, doubled by vitest.preset.ts's
        # retry-on-timeout condition) instead of failing clearly. The root
        # `npm run typecheck` above is `tsc --build`, which only covers
        # tsconfig.json's project references (core, mcp-server, cli, enterprise) —
        # doc-retrieval-mcp is NOT one of them, so it must be built explicitly, in
        # dependency order (core first, since doc-retrieval-mcp depends on it).
        run: |
          set -eu
          npm run build -w @skillsmith/core
          npm run build -w @skillsmith/doc-retrieval-mcp

      - name: Verify mcp-disconnect worker was built (SMI-5984)
        # Fails loudly here, with a clear message, instead of resurfacing as an
        # opaque 10s vitest timeout in the step below.
        run: |
          set -eu
          test -f packages/doc-retrieval-mcp/dist/src/_lib/mcp-disconnect-worker.js || {
            echo "::error::packages/doc-retrieval-mcp/dist/src/_lib/mcp-disconnect-worker.js was not produced by the build step — mcp-disconnect-state.test.ts will time out. Check the 'Build core + doc-retrieval-mcp' step above."
            exit 1
          }

      - name: Root vitest config (SMI-3502 runner)
        run: npx vitest run --config vitest.config.root-tests.ts

      - name: File or update auto-issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Post-merge verify failed on main"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(cat <<EOF
          Post-merge verification failed on \`main\`.

          - Commit: ${{ github.sha }}
          - Run: $RUN_URL
          - Triggered by: @${{ github.actor }}

          This workflow runs host-equivalent typecheck and the root vitest config
          (\`vitest.config.root-tests.ts\`) which are not covered by the PR matrix.
          See \`docs/internal/implementation/smi-4210-4212-ci-safety-net.md\` (SMI-4211).
          EOF
          )
          EXISTING=$(gh issue list \
            --label post-merge-verify \
            --state open \
            --search "$TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Filing new auto-issue"
            gh issue create \
              --title "$TITLE ($RUN_URL)" \
              --body "$BODY" \
              --label ci-failure,post-merge-verify
          fi
