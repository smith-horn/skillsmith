# SMI-1617: GitHub Actions workflow for skill metadata refresh (stars, quality_score).
#
# SMI-7114 W3b: the schedule no longer triggers the refresh. Supabase pg_cron does
# (`skills-refresh-metadata`, `32 2-22/4 * * *`), because GitHub delivered only 22-28 of
# 42 scheduled runs a week. The schedule now runs the independent OBSERVER
# (scripts/ci/refresh-observer.sh), which reads refresh_metadata_health() and alerts
# `refresh_unhealthy` when refresh is stale, pg_cron stopped dispatching, or a dispatch
# failed. It is never retired: it runs on a different scheduler from the thing it watches.
# Its `refresh:observer` heartbeat arms a pg_cron dead-man that pages if it stops running.
#
# workflow_dispatch still POSTs the function directly, for manual or dry runs.
# Rollback: revert the W3b commit to restore schedule-triggered refresh.

name: Skill Metadata Refresh

on:
  schedule:
    # Observer cadence. The dead-man SLA (16h) was sized from this schedule's measured gaps;
    # change both together.
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of skills to refresh (default: 200, max: 500)'
        required: false
        default: '200'
        type: string
      stale_days:
        description: 'Only refresh skills older than N days (default: 1)'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: 'false'
        type: boolean

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  observe:
    name: Observe Metadata Refresh
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/refresh-observer.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run refresh observer
        env:
          SKILLSMITH_REFRESH_OBSERVER_ALERT_DISABLE: ${{ vars.SKILLSMITH_REFRESH_OBSERVER_ALERT_DISABLE }}
        run: bash scripts/ci/refresh-observer.sh

  refresh:
    name: Refresh Skill Metadata
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Validate Secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Required secrets not configured. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to repository secrets."
            exit 1
          fi
          echo "✓ Secrets validated"

      - name: Trigger Metadata Refresh
        id: refresh
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '200' }}"
          STALE_DAYS="${{ github.event.inputs.stale_days || '1' }}"

          call_refresh() {
            local batch=$1
            local body="{\"batchSize\": $batch, \"staleDays\": $STALE_DAYS, \"dryRun\": $DRY_RUN}"
            echo "Triggering metadata refresh with batch=$batch: $body"

            local response
            response=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$SUPABASE_URL/functions/v1/skills-refresh-metadata")

            FINAL_HTTP_CODE=$(echo "$response" | tail -n1)
            FINAL_BODY=$(echo "$response" | sed '$d')

            echo "Response code: $FINAL_HTTP_CODE"
            echo "Response body: $FINAL_BODY"
          }

          # First attempt with full batch
          call_refresh "$BATCH_SIZE"

          # Retry with half batch on transient errors (502 Bad Gateway, 503 Temporarily Unavailable, 546 Worker Limit)
          if [ "$FINAL_HTTP_CODE" = "502" ] || [ "$FINAL_HTTP_CODE" = "503" ] || [ "$FINAL_HTTP_CODE" = "546" ]; then
            RETRY_BATCH=$(( BATCH_SIZE / 2 ))
            echo "::warning::Transient error (HTTP $FINAL_HTTP_CODE). Retrying with batch=$RETRY_BATCH in 30s..."
            sleep 30
            call_refresh "$RETRY_BATCH"
          fi

          # Write final result to step outputs (only once, after potential retry)
          echo "http_code=$FINAL_HTTP_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "response<<EOF_SKILLSMITH_REFRESH_7f3a"
            echo "$FINAL_BODY" | head -c 1000
            echo ""
            echo "EOF_SKILLSMITH_REFRESH_7f3a"
          } >> "$GITHUB_OUTPUT"

          if [ "$FINAL_HTTP_CODE" -ne 200 ]; then
            echo "::error::Metadata refresh failed with status $FINAL_HTTP_CODE"
            exit 1
          fi

      - name: Parse Results
        if: success()
        env:
          # Via env, not inline ${{ }}: a quote in the response body must not break the shell.
          RESPONSE: ${{ steps.refresh.outputs.response }}
        run: |
          PROCESSED=$(echo "$RESPONSE" | jq -r '.data.processed // 0')
          UPDATED=$(echo "$RESPONSE" | jq -r '.data.updated // 0')
          FAILED=$(echo "$RESPONSE" | jq -r '.data.failed // 0')
          SKIPPED=$(echo "$RESPONSE" | jq -r '.data.skipped // 0')
          DRY_RUN=$(echo "$RESPONSE" | jq -r '.meta.dry_run // false')
          {
            echo "### Metadata Refresh Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Processed | $PROCESSED |"
            echo "| Updated | $UPDATED |"
            echo "| Skipped | $SKIPPED |"
            echo "| Failed | $FAILED |"
            echo "| Dry Run | $DRY_RUN |"
            if [ "$FAILED" -gt 0 ]; then
              echo ""
              echo "Some skills failed to refresh. Check the errors in the response."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Failure
        if: failure()
        env:
          HTTP_CODE: ${{ steps.refresh.outputs.http_code }}
        run: |
          {
            echo "### Metadata Refresh Failed"
            echo ""
            echo "HTTP Code: $HTTP_CODE"
            echo ""
            echo "Response body logged in the Trigger Metadata Refresh step above."
          } >> "$GITHUB_STEP_SUMMARY"
