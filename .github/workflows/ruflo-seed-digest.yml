name: Ruflo Seed Digest Guard

# SMI-6744, ADR-170 (Accepted) SS 7, finding M-8.
#
# ADR-170 SS 7 requires: "CI independently derives the canonical manifest
# and its digest from the accepted build and publishes the expected digest
# outside the image, as a committed ... acceptance input." This workflow is
# that independent derivation: it builds the `ruflo` Dockerfile stage from
# scratch on a clean runner (never trusting whatever image a developer's
# local Docker cache happens to hold), then runs
# scripts/ruflo-seed/regenerate-digest.sh in --check mode, which fails the
# PR if the freshly-derived digest does not match the committed
# scripts/ruflo-seed/SEED-MANIFEST.sha256.
#
# This workflow file lives under .github/workflows/, an ADR-109
# infrastructure-change trigger path; the design it implements is ADR-170
# itself (Accepted), so this file is the implementation of an already
# plan-reviewed design, not a new infra decision of its own.
#
# Never trusts a digest read from inside the image (ADR-170 SS 7, round-4
# finding 2): regenerate-digest.sh always docker-cps THIS CHECKOUT's own
# scripts/ruflo-seed/manifest.mjs into a throwaway container built from the
# image under test, rather than running the generator copy the image itself
# carries at /opt/ruflo-manifest/generate-manifest.mjs.

on:
  pull_request:
    paths:
      - 'scripts/ruflo-seed/**'
      - 'Dockerfile'
      - 'scripts/ruflo-service-entrypoint.sh'
      - '.github/workflows/ruflo-seed-digest.yml'

permissions:
  contents: read

concurrency:
  group: ruflo-seed-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-digest:
    name: Verify SEED-MANIFEST.sha256
    # linux/arm64, not ubuntu-latest (amd64): the served tree's lockfile carries 122
    # platform-scoped optional packages (47 arm64, 58 x64), so the canonical tree
    # digest is a property of the build platform. The committed digest is derived
    # on linux/arm64 (the dev fleet's Docker Desktop on Apple Silicon); an amd64
    # runner installs a different tree and the check would fail on a correct
    # seed. Public repos get GitHub-hosted arm64 runners at no cost (SMI-6744 A1.8).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # GHA-hosted BuildKit cache (type=gha): this workflow only needs to
      # build ONE stage for ONE short-lived job, so the repo's usual
      # registry-cache pattern (GHCR login, cache-to on main only) is more
      # machinery than this needs -- type=gha needs no registry credentials
      # and works identically on a fork PR's read-only GITHUB_TOKEN.
      - name: Build ruflo stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          target: ruflo
          tags: skillsmith-ruflo-seed:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ADR-170 SS 7's own CI derivation: never build a second time here,
      # and never write SEED-MANIFEST.sha256 -- --check only compares and
      # fails loudly on a mismatch.
      - name: Verify committed digest matches the freshly-built image
        run: |
          ./scripts/ruflo-seed/regenerate-digest.sh --no-build skillsmith-ruflo-seed:ci-${{ github.sha }} --check
