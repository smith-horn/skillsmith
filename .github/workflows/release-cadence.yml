# SMI-4191: weekly release-cadence workflow.
# Hybrid trigger: Sunday 03:00 UTC OR manual dispatch. Runs prepare-release.ts
# on a new branch if root CHANGELOG.md [Unreleased] is non-empty; opens a PR
# for human review. Does NOT auto-merge. See ADR-114.
#
# Threshold-based trigger (mid-week fast-path) is a separate concern: the
# detect-changes / on:push path would call check-unreleased-threshold.mjs
# with exit code 1 signalling "over threshold". That wiring is in CI infra
# work separate from this file; this workflow covers the time-based path.

name: Release Cadence

on:
  schedule:
    # SMI-6052: shifted from '0 3 * * 0' off the exact top of the hour — GitHub's own
    # docs flag :00 as the highest-contention minute for scheduled workflows, and this
    # repo also clusters ~12 scheduled jobs across 00:00-06:00 UTC on Sundays. This is a
    # bounded mitigation attempt, NOT a claimed fix — GitHub Actions' schedule trigger
    # remains best-effort and can still delay regardless of minute (confirmed: even
    # detect-release-drift.yml at :15 delayed 35-58min on 2026-08-16). The real defenses
    # against the delay are the collision guard below (Change 1) and the
    # release-cadence-heartbeat-monitor backstop (Supabase pg_cron, decoupled from
    # GitHub Actions' own scheduler). See docs/internal/implementation/smi-6052-*.md.
    - cron: '17 3 * * 0' # Sunday 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip PR creation; report only'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-cadence
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  cadence:
    name: Weekly cadence check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check [Unreleased] entry count
        id: check
        run: |
          set +e
          node scripts/check-unreleased-threshold.mjs --file CHANGELOG.md
          EXIT=$?
          set -e
          # SMI-4394: pipe through `head -n 1` + whitespace-strip + numeric
          # sanity check. Prior `|| echo 0` fallback concatenated fallback
          # stdout with the script's earlier stdout on non-zero exits,
          # producing multi-line COUNT like "33\n0" which then made
          # `echo "count=$COUNT" >> $GITHUB_OUTPUT` emit two lines — the
          # bare "0" tripped GHA's "Invalid format '0'" file-command error
          # on 2026-04-19 first run.
          COUNT=$(node scripts/check-unreleased-threshold.mjs --file CHANGELOG.md 2>/dev/null | head -n 1 | tr -d '[:space:]')
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then COUNT=0; fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          echo "## Cadence Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Unreleased] entries: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threshold exit: $EXIT (0 under, 1 over, 2 no [Unreleased])" >> "$GITHUB_STEP_SUMMARY"

      - name: Exit early when [Unreleased] is empty
        if: steps.check.outputs.count == '0'
        run: |
          echo "[Unreleased] is empty — nothing to release. Exiting." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # SMI-6052: branch/PR-collision guard. Two independent triggers landing on the
      # same UTC calendar day (a manual workflow_dispatch recovery run + a subsequently
      # late-arriving schedule run, or two manual dispatches) race on the shared
      # release-cadence/<date> branch name. Whichever run's push lands second gets a
      # non-fast-forward rejection and the job fails, firing a confusing SMI-4938
      # failure email even though the release goal was already met by the first run.
      # This step positively confirms today's state before doing any work:
      #   - an open OR merged PR for today already exists -> the goal is met, skip
      #     cleanly (exit 0, not a failure)
      #   - a closed-but-NOT-merged PR (e.g. a human explicitly rejected it) does NOT
      #     count as satisfied -> fall through and proceed normally
      #   - the branch exists on origin with NO qualifying PR behind it -> a prior run
      #     pushed but died before opening a PR; retrying the push would hit the exact
      #     same failure this guard exists to prevent, so fail loud with an actionable
      #     diagnostic instead of a silent duplicate failure
      - name: Check for an existing PR/branch today
        if: steps.check.outputs.count != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="release-cadence/${DATE}"
          # `-H/--head` is an EXACT branch filter ("<owner>:<branch>" syntax not
          # supported per --help, so pass the bare branch name) — deliberately NOT
          # `--search "head:${BRANCH}"`, which is a fuzzy full-text search that can
          # match unrelated PRs whose body/title happens to contain the branch
          # string (PR-review finding, SMI-6052: the prior version requested this
          # exact match in its own comment but never actually enforced it).
          EXISTING=$(gh pr list --state all --head "$BRANCH" --json number,url,state,headRefName --limit 5)

          # Belt-and-suspenders: --head is already exact, but re-verify
          # headRefName in jq too so a future flag/behavior change in `gh` can't
          # silently reopen the fuzzy-match gap without a visible diff here.
          QUALIFYING=$(echo "$EXISTING" | jq --arg branch "$BRANCH" \
            '[.[] | select(.headRefName == $branch and ((.state == "OPEN") or (.state == "MERGED")))] | length')

          if [ "$QUALIFYING" != "0" ]; then
            URL=$(echo "$EXISTING" | jq -r --arg branch "$BRANCH" \
              '[.[] | select(.headRefName == $branch and (.state == "OPEN" or .state == "MERGED"))][0].url')
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "A release-cadence PR for ${DATE} already exists (open or merged): $URL — skipping this run (branch-collision guard, SMI-6052)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No qualifying PR. If the branch itself already exists on the remote,
          # fail loud rather than retry the push — but the DIAGNOSTIC must
          # distinguish two different causes (PR-review finding, SMI-6052 round
          # 3): (a) a closed-but-NOT-merged PR exists for this branch (a human
          # explicitly rejected it; the branch was deliberately preserved, not
          # left behind by a crash — SMI-5663's own "branch preserved"
          # convention) vs. (b) truly no PR of any kind exists (a prior run got
          # as far as the push but died before `gh pr create`). Retrying the
          # push would conflict with the old branch's diverged history either
          # way, so both cases still fail loud — but (a)'s message must say "a
          # closed PR exists" instead of the misleading "a prior run likely
          # pushed but failed before opening a PR", which is simply false when
          # a PR clearly exists.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            ANY_PR_COUNT=$(echo "$EXISTING" | jq --arg branch "$BRANCH" '[.[] | select(.headRefName == $branch)] | length')
            if [ "$ANY_PR_COUNT" != "0" ]; then
              CLOSED_URL=$(echo "$EXISTING" | jq -r --arg branch "$BRANCH" '[.[] | select(.headRefName == $branch)][0].url')
              echo "::error::Branch ${BRANCH} exists on origin with a CLOSED (not merged) PR: ${CLOSED_URL} — a fresh push would conflict with that PR's history. Investigate manually before retrying; do not delete/force-push without confirming with whoever closed it." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Branch ${BRANCH} exists on origin but no PR of any kind was found for it — a prior run likely pushed but failed before opening a PR. Investigate manually (gh pr list --state all --head \"${BRANCH}\"); do not silently retry the push." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          echo "count=0" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (prepare-release needs them)
        if: steps.check.outputs.count != '0' && steps.existing.outputs.count == '0'
        run: npm ci --ignore-scripts

      - name: Create cadence branch
        if: steps.check.outputs.count != '0' && steps.existing.outputs.count == '0'
        id: branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="release-cadence/${DATE}"
          git config user.name "skillsmith-cadence[bot]"
          git config user.email "skillsmith-cadence@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Run prepare-release.ts
        if: steps.check.outputs.count != '0' && steps.existing.outputs.count == '0'
        run: npx tsx scripts/prepare-release.ts --all=patch

      - name: Push branch
        if: steps.check.outputs.count != '0' && steps.existing.outputs.count == '0' && github.event.inputs.dry_run != 'true'
        run: git push origin "${{ steps.branch.outputs.branch }}"

      - name: Open PR
        if: steps.check.outputs.count != '0' && steps.existing.outputs.count == '0' && github.event.inputs.dry_run != 'true'
        env:
          # SMI-5047: GITHUB_TOKEN cannot create PRs because the repo-level
          # "Allow GitHub Actions to create and approve pull requests" setting
          # is disabled (failure mode introduced ~2026-04-26; 4 missed Sunday
          # windows). Use a dedicated RELEASE_PAT (least-privilege: only
          # pull-requests:write + contents:write on smith-horn/skillsmith)
          # rather than reusing GH_PAT, which would broaden batch-transform
          # and indexer-dispatch blast radius.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr create \
            --title "chore(release): weekly cadence bump — ${{ steps.branch.outputs.date }}" \
            --body "$(cat <<EOF
          Automated weekly release cadence PR opened by \`release-cadence.yml\` (SMI-4191).

          ## What this PR does

          Runs \`scripts/prepare-release.ts --all=patch\` to bump all packages by one patch version and drain per-package CHANGELOG \`[Unreleased]\` sections into the new versions.

          ## What to check before merging

          1. The bumped versions match what you want to ship (patch/minor/major). If minor or major is needed, close this PR, run \`prepare-release.ts\` with the right flags locally, and open a manual PR.
          2. The CHANGELOG entries read cleanly and reference the right Linear issues.
          3. CI is green.

          ## After merging

          Trigger publish: \`gh workflow run publish.yml -f dry_run=false\`. The \`create-gh-release\` job will create matching GitHub Releases automatically.

          Parent: SMI-4144. See [ADR-114](docs/internal/adr/114-release-cadence-and-gh-release-alignment.md).
          EOF
          )" \
            --base main \
            --head "${{ steps.branch.outputs.branch }}"

      # SMI-4938: email alert on scheduled failure. Before this, release-cadence
      # had no failure signal and its "Open PR" step failed silently for weeks.
      - name: Send alert on failure
        if: failure() && github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/functions/v1/alert-notify" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "release_cadence_failed",
              "message": "The weekly release-cadence workflow failed. Check GitHub Actions for details.",
              "workflow": "Release Cadence",
              "runId": "${{ github.run_id }}",
              "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "Alert notification failed (non-fatal)"
