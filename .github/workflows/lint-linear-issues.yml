# SMI-5841: Lint Linear issues for the required-fields template contract.
# Backstop for the MCP tool path (mcp__linear__save_issue), which has no
# server-side gate — unlike the CLI/SDK path (create-issue/create-sub-issue
# in the user-level `linear` skill), which rejects bad descriptions
# programmatically. See docs/internal/implementation/smi-5841-lint-linear-issues-ci.md.

name: Lint Linear Issues

on:
  schedule:
    # 07:21 UTC daily -- 21 minutes offset from indexer.yml's 0 7 * * * job
    # (different API/token/concurrency group, not an exact collision).
    - cron: '21 7 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only lint issues created after this ISO date (default: 48h ago)'
        required: false

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint recently-created Linear issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.SKILLSMITH_LINT_LINEAR_ISSUES_DISABLE != '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lint
        id: lint
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SINCE_INPUT: ${{ inputs.since }}
        run: |
          ARGS=()
          if [ -n "$SINCE_INPUT" ]; then
            ARGS+=(--since "$SINCE_INPUT")
          fi
          node scripts/lint-linear-issues.mjs "${ARGS[@]}" --json > /tmp/lint-results.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check for violations
        id: check
        if: steps.lint.outcome == 'success' || steps.lint.outcome == 'failure'
        run: |
          if [ ! -f /tmp/lint-results.json ] || ! jq empty /tmp/lint-results.json 2>/dev/null; then
            echo "::error::Lint script crashed or produced invalid output"
            echo "violation_count=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          VIOLATION_COUNT=$(jq -r '.violations | length' /tmp/lint-results.json)
          TOTAL=$(jq -r '.total' /tmp/lint-results.json)
          echo "violation_count=$VIOLATION_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        if: steps.check.outputs.violation_count != '0' && vars.SKILLSMITH_LINT_LINEAR_ISSUES_SHADOW == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create linear-issue-template-gap --description "Linear issue missing required Acceptance Criteria template fields" --color "fbca04" 2>/dev/null || true

      - name: Create or update tracking issue
        if: steps.check.outputs.violation_count != '0' && vars.SKILLSMITH_LINT_LINEAR_ISSUES_SHADOW == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIOLATION_COUNT=${{ steps.check.outputs.violation_count }}
          DATE=$(date -u +%Y-%m-%d)

          BODY="## Linear Issue Template Gap - $DATE

          **$VIOLATION_COUNT issue(s)** created via the MCP tool path are missing required template fields (Acceptance Criteria section with >= 2 concrete items).

          ### Violations (first 50 of $VIOLATION_COUNT)
          "
          BODY+=$(jq -r '[.violations[] | "- **\(.identifier)**: \(.title) (\(.url)) — \(.errors[0])"] | .[0:50] | join("\n")' /tmp/lint-results.json)
          if [ "$VIOLATION_COUNT" -gt 50 ]; then
            BODY+="

          …and $((VIOLATION_COUNT - 50)) more — see the [step summary](https://github.com/smith-horn/skillsmith/actions/workflows/lint-linear-issues.yml) of the triggering run for the full list."
          fi
          BODY+="

          ### Resolution
          For each issue above, either:
          1. **Edit the issue** to add the missing Acceptance Criteria section
          2. **Close it** if it was created in error

          ---
          *Generated by [lint-linear-issues.yml](https://github.com/smith-horn/skillsmith/actions/workflows/lint-linear-issues.yml)*"

          EXISTING=$(gh issue list --label linear-issue-template-gap --state open --search "Linear Issue Template Gap" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Creating new tracking issue"
            gh issue create \
              --title "Linear Issue Template Gap: $VIOLATION_COUNT unresolved — $DATE" \
              --body "$BODY" \
              --label linear-issue-template-gap
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## Lint Linear Issues Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/lint-results.json ]; then
            TOTAL=$(jq -r '.total' /tmp/lint-results.json 2>/dev/null || echo "?")
            VIOLATIONS=$(jq -r '.violations | length' /tmp/lint-results.json 2>/dev/null || echo "?")
            SINCE=$(jq -r '.since' /tmp/lint-results.json 2>/dev/null || echo "?")
            SHADOW="${{ vars.SKILLSMITH_LINT_LINEAR_ISSUES_SHADOW != '0' }}"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Since | $SINCE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total scanned | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Violations** | **$VIOLATIONS** |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Shadow mode (no issue paging) | $SHADOW |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$VIOLATIONS" != "0" ] && [ "$VIOLATIONS" != "?" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.violations[] | "- \(.identifier): \(.title) (\(.url)) — \(.errors[0])"' /tmp/lint-results.json >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Lint did not produce results. Check logs." >> "$GITHUB_STEP_SUMMARY"
          fi
