# Batch Skill Transformation Workflow
# SMI-1838: Pre-transform all skills using TransformationService
#
# Schedule: Weekly on Sunday at 2 AM UTC
# Manual trigger: workflow_dispatch
#
# Required secrets:
#   - SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - SKILLSMITH_SUPPORT_PAT (GitHub Personal Access Token for 5,000 req/hr rate limit; SMI-6187, was GH_PAT)

name: Batch Skill Transformation

on:
  schedule:
    # SMI-4393: offset from security-scan.yml which also fires at 0 2 * * 0
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum skills to process (0 = unlimited)'
        required: false
        default: '0'
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '22'

jobs:
  transform:
    name: Transform Skills
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2 hours max
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npm run build

      - name: Run batch transformation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.SKILLSMITH_SUPPORT_PAT }} # 5,000 req/hr vs 60 req/hr anonymous
        run: |
          ARGS="--verbose"

          # Add limit if specified and not 0
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi

          # Add dry-run if specified
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: npm run transform:batch -- $ARGS"
          npm run transform:batch -- $ARGS

      - name: Report success
        if: success()
        run: |
          echo "✅ Batch transformation completed successfully"
          echo "Check Supabase for transformation results"

      # Only alert on scheduled runs to avoid noise during manual testing
      - name: Alert on failure
        if: failure() && github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/functions/v1/alert-notify" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "batch_transform_failed",
              "message": "The weekly batch skill transformation job failed. Check GitHub Actions for details.",
              "workflow": "Batch Skill Transformation",
              "runId": "${{ github.run_id }}",
              "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "Alert notification failed (non-fatal)"
