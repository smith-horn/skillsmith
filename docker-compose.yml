services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
      # can distinguish a Skillsmith-built `<project>-dev` image from another
      # repo's generically-shaped `dev` service image sharing the same Compose
      # conventions. Applies at build time only -- pre-existing images stay
      # unlabeled (report-only "UNCONFIRMED ownership" until --include-unlabeled).
      labels:
        app.skillsmith.owned: 'true'
    container_name: skillsmith-dev-1
    # SMI-5245: auto-recover the long-lived dev container after a Docker daemon /
    # machine restart so the doc-retrieval + skillsmith MCP servers (launched via
    # `docker exec` in .mcp.json) don't silently drop with a -32000 reconnect error.
    # `unless-stopped` (not `always`): honors an explicit `docker stop` / `compose
    # down` so the CLAUDE.md recovery flows that rely on `down` staying down still
    # work. dev-only — `test` runs one-shot commands and must not loop.
    restart: unless-stopped
    # SMI-6064: explicit per-container resource ceiling. Docker Desktop's VM
    # pool (10 CPUs / 7.75GiB on the calibration machine, `docker info`) is
    # shared uncapped across every worktree's dev container -- `docker stats`
    # showed all 15 concurrently-running containers reporting the SAME
    # 7.75GiB "LIMIT" (the whole-VM allocation, not a per-container cap),
    # meaning one hot container can starve every sibling. Override per
    # developer machine via SKILLSMITH_DOCKER_CPUS / SKILLSMITH_DOCKER_MEM
    # env vars -- same pattern as DEV_PORT below. See docs/internal/
    # implementation/docker-resource-ceiling.md's Decision Log for the
    # calibration formula, the empirical `npm run lint` memory measurement
    # behind the 6g default, and how to compute your own values.
    # Deliberately NOT applied to the `test` service below -- it's
    # one-shot/CI and never multiplied across worktrees the way `dev` is.
    cpus: '${SKILLSMITH_DOCKER_CPUS:-4}'
    mem_limit: ${SKILLSMITH_DOCKER_MEM:-6g}
    ports:
      - '${DEV_PORT:-3001}:3001'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # SMI-5957 correction #5: per-package named volumes, mirroring the root
      # node_modules volume above -- the `.:/app` bind mount replaces the
      # image's baked /app with a fresh checkout at container start, which
      # has NO packages/*/node_modules directories at all (gitignored build
      # artifacts). Only /app/node_modules was previously protected, so any
      # package whose dependency needs a NESTED copy (a version conflict
      # with whatever's hoisted to root -- e.g. @skillsmith/mcp-server pins
      # zod@3.25.76 while @skillsmith/core pins zod@4.2.1, so npm nests a
      # separate zod@3.25.76 under packages/mcp-server/node_modules per
      # package-lock.json) had that nested copy silently erased on every
      # non-worktree container start, even though `npm ci` at image-build
      # time installed it correctly. TypeScript/Node module resolution then
      # fell through past the now-empty nested directory to the
      # root-hoisted (wrong) version -- confirmed live in CI: a cold,
      # cache-bypassed build of @skillsmith/mcp-server failed with a real
      # TS2339 (`.innerType()` does not exist), because the resolved zod was
      # v4, not v3 -- deterministic every restart, not a race or a broken
      # test. All 8 workspace packages are covered, not just mcp-server:
      # npm's hoisting choices can shift as the dependency graph evolves, so
      # any package could need a nested copy in the future. Each volume
      # auto-populates from the image's build-time `npm ci` output on first
      # mount, exactly like the existing root node_modules volume already
      # does.
      - cli-node-modules:/app/packages/cli/node_modules
      - core-node-modules:/app/packages/core/node_modules
      - doc-retrieval-mcp-node-modules:/app/packages/doc-retrieval-mcp/node_modules
      - enterprise-node-modules:/app/packages/enterprise/node_modules
      - mcp-server-node-modules:/app/packages/mcp-server/node_modules
      - skillsmith-cli-node-modules:/app/packages/skillsmith-cli/node_modules
      - vscode-extension-node-modules:/app/packages/vscode-extension/node_modules
      - website-node-modules:/app/packages/website/node_modules
      # SMI-4677: bind host Claude Code memory dir read-only for the
      # doc-retrieval-mcp memory-topic-files adapter. Source path uses
      # ${HOME} (resolved host-side at compose-parse time) +
      # ${SKILLSMITH_PROJECT_DIR_ENCODED} (per-contributor; see .env.schema).
      # The `:-` empty-default is intentional (SMI-4910): contributors without
      # a .env get a silent (warning-free) blank rather than a Compose WARN.
      # Bind always succeeds; if the source dir doesn't exist, Docker creates
      # an empty mount and the adapter's existsSync guard skips it gracefully.
      # Test profile omits this bind by design (CI runners have no host memory dir).
      - ${HOME}/.claude/projects/${SKILLSMITH_PROJECT_DIR_ENCODED:-}/memory:/skillsmith-memory:ro
      # SMI-5793: bind host ~/.skillsmith read-write so the reindex CLI
      # (running inside this container via .husky/post-commit's `docker exec`)
      # can persist its structured log + reindex.state to a host-visible path
      # instead of the container's own throwaway filesystem. Read-write,
      # unlike the memory-dir mount above, since this direction WRITES.
      # dev-only — `test` never runs reindex (assertNotInCi() guards it
      # unconditionally) and has no host ~/.skillsmith to bind anyway.
      - ${HOME}/.skillsmith:/skillsmith-state
    environment:
      - NODE_ENV=development
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # SMI-4677: tells doc-retrieval-mcp memory-topic-files adapter to
      # bypass its homedir()-derived path resolution and read from the
      # bind-mounted dir above instead.
      - SKILLSMITH_MEMORY_DIR_OVERRIDE=/skillsmith-memory
      # SMI-5793: tells the reindex CLI's state/log-path resolvers
      # (reindex-state.ts's resolveReindexStateDir(), rotation.ts's
      # getLogDir()) to write to the bind-mounted path above instead of
      # homedir()-derived /root/.skillsmith (the container's own throwaway
      # home, invisible on the host).
      - SKILLSMITH_STATE_DIR_OVERRIDE=/skillsmith-state
    entrypoint: ['/app/docker-entrypoint.sh']
    command: tail -f /dev/null
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - dev

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: skillsmith-test-1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # SMI-5957 correction #5: see the `dev` service's volumes block above
      # for the full rationale -- same fix, same reason, applied to `test`.
      - cli-node-modules:/app/packages/cli/node_modules
      - core-node-modules:/app/packages/core/node_modules
      - doc-retrieval-mcp-node-modules:/app/packages/doc-retrieval-mcp/node_modules
      - enterprise-node-modules:/app/packages/enterprise/node_modules
      - mcp-server-node-modules:/app/packages/mcp-server/node_modules
      - skillsmith-cli-node-modules:/app/packages/skillsmith-cli/node_modules
      - vscode-extension-node-modules:/app/packages/vscode-extension/node_modules
      - website-node-modules:/app/packages/website/node_modules
    environment:
      - NODE_ENV=test
    entrypoint: ['/app/docker-entrypoint.sh']
    command: npm test
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - test

volumes:
  node_modules:
    # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
    # can distinguish a Skillsmith-owned `<project>_node_modules` volume from
    # another repo's generically-shaped `node_modules` volume sharing the same
    # Compose conventions. Applies at creation time only -- Compose does not
    # recreate an existing named volume when its label config changes, so this
    # does not disturb any currently-live worktree's volume.
    labels:
      app.skillsmith.owned: 'true'
  # SMI-5957 correction #5: one named volume per workspace package, backing
  # the per-package node_modules mounts declared on `dev` and `test` above.
  # Same SMI-5750 ownership-label rationale as the root node_modules volume.
  cli-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  core-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  doc-retrieval-mcp-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  enterprise-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  mcp-server-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  skillsmith-cli-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  vscode-extension-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  website-node-modules:
    labels:
      app.skillsmith.owned: 'true'
