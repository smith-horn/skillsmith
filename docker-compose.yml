services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
      # can distinguish a Skillsmith-built `<project>-dev` image from another
      # repo's generically-shaped `dev` service image sharing the same Compose
      # conventions. Applies at build time only -- pre-existing images stay
      # unlabeled (report-only "UNCONFIRMED ownership" until --include-unlabeled).
      labels:
        app.skillsmith.owned: 'true'
    container_name: skillsmith-dev-1
    # SMI-5245: auto-recover the long-lived dev container after a Docker daemon /
    # machine restart so the doc-retrieval + skillsmith MCP servers (launched via
    # `docker exec` in .mcp.json) don't silently drop with a -32000 reconnect error.
    # `unless-stopped` (not `always`): honors an explicit `docker stop` / `compose
    # down` so the CLAUDE.md recovery flows that rely on `down` staying down still
    # work. dev-only — `test` runs one-shot commands and must not loop.
    restart: unless-stopped
    # SMI-6064: explicit per-container resource ceiling. Docker Desktop's VM
    # pool (10 CPUs / 7.75GiB on the calibration machine, `docker info`) is
    # shared uncapped across every worktree's dev container -- `docker stats`
    # showed all 15 concurrently-running containers reporting the SAME
    # 7.75GiB "LIMIT" (the whole-VM allocation, not a per-container cap),
    # meaning one hot container can starve every sibling. Override per
    # developer machine via SKILLSMITH_DOCKER_CPUS / SKILLSMITH_DOCKER_MEM
    # env vars -- same pattern as DEV_PORT below. See docs/internal/
    # implementation/docker-resource-ceiling.md's Decision Log for the
    # calibration formula, the empirical `npm run lint` memory measurement
    # behind the 6g default, and how to compute your own values.
    # Deliberately NOT applied to the `test` service below -- it's
    # one-shot/CI and never multiplied across worktrees the way `dev` is.
    cpus: '${SKILLSMITH_DOCKER_CPUS:-4}'
    mem_limit: ${SKILLSMITH_DOCKER_MEM:-6g}
    ports:
      - '${DEV_PORT:-3001}:3001'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # SMI-5957 correction #5: per-package named volumes, mirroring the root
      # node_modules volume above -- the `.:/app` bind mount replaces the
      # image's baked /app with a fresh checkout at container start, which
      # has NO packages/*/node_modules directories at all (gitignored build
      # artifacts). Only /app/node_modules was previously protected, so any
      # package whose dependency needs a NESTED copy (a version conflict
      # with whatever's hoisted to root -- e.g. @skillsmith/mcp-server pins
      # zod@3.25.76 while @skillsmith/core pins zod@4.2.1, so npm nests a
      # separate zod@3.25.76 under packages/mcp-server/node_modules per
      # package-lock.json) had that nested copy silently erased on every
      # non-worktree container start, even though `npm ci` at image-build
      # time installed it correctly. TypeScript/Node module resolution then
      # fell through past the now-empty nested directory to the
      # root-hoisted (wrong) version -- confirmed live in CI: a cold,
      # cache-bypassed build of @skillsmith/mcp-server failed with a real
      # TS2339 (`.innerType()` does not exist), because the resolved zod was
      # v4, not v3 -- deterministic every restart, not a race or a broken
      # test. All 8 workspace packages are covered, not just mcp-server:
      # npm's hoisting choices can shift as the dependency graph evolves, so
      # any package could need a nested copy in the future. Each volume
      # auto-populates from the image's build-time `npm ci` output on first
      # mount, exactly like the existing root node_modules volume already
      # does.
      #
      # SMI-6453: any HOST-side inspection or `rm -rf` of these paths reads/
      # writes a different filesystem than the container -- this is exactly
      # what silently broke scripts/mcp-doc-retrieval-launcher.sh's
      # dependency probe. See that script's header comment before adding a
      # new volume here or writing a preflight check against one.
      - cli-node-modules:/app/packages/cli/node_modules
      - core-node-modules:/app/packages/core/node_modules
      - doc-retrieval-mcp-node-modules:/app/packages/doc-retrieval-mcp/node_modules
      - enterprise-node-modules:/app/packages/enterprise/node_modules
      - mcp-server-node-modules:/app/packages/mcp-server/node_modules
      - skillsmith-cli-node-modules:/app/packages/skillsmith-cli/node_modules
      - vscode-extension-node-modules:/app/packages/vscode-extension/node_modules
      - website-node-modules:/app/packages/website/node_modules
      # SMI-6192: route the @astrojs/vercel adapter's git-ignored build
      # output through a named volume instead of the .:/app bind mount --
      # see docs/internal/implementation/smi-6192-website-vercel-output-eacces.md
      - website-vercel-output:/app/packages/website/.vercel
      # SMI-4677: bind host Claude Code memory dir read-only for the
      # doc-retrieval-mcp memory-topic-files adapter. Source path uses
      # ${HOME} (resolved host-side at compose-parse time) +
      # ${SKILLSMITH_PROJECT_DIR_ENCODED} (per-contributor; see .env.schema).
      # The `:-` empty-default is intentional (SMI-4910): contributors without
      # a .env get a silent (warning-free) blank rather than a Compose WARN.
      # Bind always succeeds; if the source dir doesn't exist, Docker creates
      # an empty mount and the adapter's existsSync guard skips it gracefully.
      # Test profile omits this bind by design (CI runners have no host memory dir).
      - ${HOME}/.claude/projects/${SKILLSMITH_PROJECT_DIR_ENCODED:-}/memory:/skillsmith-memory:ro
      # SMI-5793: bind host ~/.skillsmith read-write so the reindex CLI
      # (running inside this container via .husky/post-commit's `docker exec`)
      # can persist its structured log + reindex.state to a host-visible path
      # instead of the container's own throwaway filesystem. Read-write,
      # unlike the memory-dir mount above, since this direction WRITES.
      # dev-only — `test` never runs reindex (assertNotInCi() guards it
      # unconditionally) and has no host ~/.skillsmith to bind anyway.
      - ${HOME}/.skillsmith:/skillsmith-state
    environment:
      - NODE_ENV=development
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # SMI-4677: tells doc-retrieval-mcp memory-topic-files adapter to
      # bypass its homedir()-derived path resolution and read from the
      # bind-mounted dir above instead.
      - SKILLSMITH_MEMORY_DIR_OVERRIDE=/skillsmith-memory
      # SMI-5793: tells the reindex CLI's state/log-path resolvers
      # (reindex-state.ts's resolveReindexStateDir(), rotation.ts's
      # getLogDir()) to write to the bind-mounted path above instead of
      # homedir()-derived /root/.skillsmith (the container's own throwaway
      # home, invisible on the host).
      - SKILLSMITH_STATE_DIR_OVERRIDE=/skillsmith-state
    entrypoint: ['/app/docker-entrypoint.sh']
    command: tail -f /dev/null
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - dev

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: skillsmith-test-1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # SMI-5957 correction #5: see the `dev` service's volumes block above
      # for the full rationale -- same fix, same reason, applied to `test`.
      - cli-node-modules:/app/packages/cli/node_modules
      - core-node-modules:/app/packages/core/node_modules
      - doc-retrieval-mcp-node-modules:/app/packages/doc-retrieval-mcp/node_modules
      - enterprise-node-modules:/app/packages/enterprise/node_modules
      - mcp-server-node-modules:/app/packages/mcp-server/node_modules
      - skillsmith-cli-node-modules:/app/packages/skillsmith-cli/node_modules
      - vscode-extension-node-modules:/app/packages/vscode-extension/node_modules
      - website-node-modules:/app/packages/website/node_modules
      # SMI-6192: see the `dev` service's volumes block above for rationale.
      - website-vercel-output:/app/packages/website/.vercel
    environment:
      - NODE_ENV=test
    entrypoint: ['/app/docker-entrypoint.sh']
    command: npm test
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - test

  # ADR-170 (docs/internal/adr/170-ruflo-mcp-server-tree-store-and-topology.md)
  # SS1/SS3/SS4/SS6/SS8: one shared MCP-server-serving container for the
  # `ruflo` (claude-flow) MCP backend, started once per MACHINE, never once
  # per worktree -- unlike `dev`/`test` above this service's profile is
  # `ruflo`, never `dev` (SS3: worktree-docker.sh's `--profile dev up -d`
  # would otherwise start a second instance per worktree). It is brought up
  # from the main checkout via scripts/ruflo-service-up.sh, never a bare
  # `docker compose --profile ruflo up -d`. Sessions never talk to this
  # service's own PID 1 -- scripts/mcp-ruflo-launcher.sh (a parallel A1.4
  # lane) `docker exec -i`s a fresh `cli.js mcp start` process into this
  # already-running container per session (SS3: "N sessions produce N
  # server processes inside a single container"), so this service exists
  # only to hold the seed image and the one shared /srv/ruflo store volume
  # alive and validated between exec's.
  ruflo:
    build:
      context: .
      dockerfile: Dockerfile
      target: ruflo
    # No `image:` here, on purpose (SMI-4653: an explicit image field turns
    # remove-worktree.sh's `down --rmi local` into a no-op; audit:standards
    # rejects one on any service). The image name is Compose's default
    # `<project>-ruflo`, and its identity is kept stable by
    # scripts/ruflo-service-up.sh instead: its linked-worktree gate (H-3(b),
    # post-merge governance retro on PR #2931) refuses to create this
    # MACHINE-GLOBAL, `restart: unless-stopped` service from any worktree.
    # M-B (SMI-6744 A1.8 retro): that gate is enforced by
    # ./scripts/ruflo-service-up.sh, NOT by Compose itself, so it constrains
    # exactly that one entry point. A bare
    # `docker compose --profile ruflo up -d ruflo` from a worktree still
    # bypasses it and would build a worktree-derived image -- that path is
    # refused only by Docker's own container-name uniqueness, i.e. only when
    # a `skillsmith-ruflo-1` already exists, never on a machine where the
    # service is down. scripts/ruflo-federation-test.sh relies on exactly
    # that bare form for its case A (checkout 2 issues it while checkout 1's
    # service runs, to prove the name collision); its case B then brings
    # checkout 2's service up through ruflo-service-up.sh once checkout 1's
    # container is removed.
    # Do NOT pin COMPOSE_PROJECT_NAME either:
    # scripts/ruflo-federation-test.sh's precondition 0 requires two checkouts
    # to resolve to DIFFERENT project names, so a second `up` is refused
    # rather than silently reconciling into a takeover.
    container_name: skillsmith-ruflo-1
    restart: unless-stopped
    # H-2 (governance review): docker-init as PID 1 forwards SIGTERM to the
    # entrypoint and reaps orphaned children, so `docker stop` no longer SIGKILLs in-flight sessions.
    init: true
    # SS3: "a blast-radius bound, not a measurement" (ADR-170's own words)
    # -- override per developer machine via SKILLSMITH_RUFLO_DOCKER_CPUS /
    # SKILLSMITH_RUFLO_DOCKER_MEM, the same ${VAR:-default} shape the `dev`
    # service above uses for SKILLSMITH_DOCKER_CPUS / SKILLSMITH_DOCKER_MEM.
    # M-13: mem_limit is a per-container budget SHARED by every concurrent
    # session's own `mcp start` server process (SS3: "N sessions produce N
    # server processes inside a single container") -- it is not a per-session
    # allowance, so a busier machine lowers the effective headroom per
    # process rather than each session getting its own 2g.
    cpus: '${SKILLSMITH_RUFLO_DOCKER_CPUS:-2}'
    mem_limit: ${SKILLSMITH_RUFLO_DOCKER_MEM:-2g}
    working_dir: /srv/ruflo
    # SS6: no attached network at all -- the service reads no repo bind
    # mount and no Docker socket, and A0.7 measured that DNS resolution
    # itself fails under this rather than the container merely being
    # firewalled off.
    network_mode: none
    # SS4: a private working directory backed by ONE volume over the whole
    # tree, not two -- ADR-170 SS4 records a measured `ruvector.db`
    # placement discrepancy (cwd root vs cwd/.swarm/) across cli runs that a
    # narrower two-volume mount would silently miss on whichever run landed
    # the file outside its coverage.
    # The expected seed digest comes from OUTSIDE the image (ADR-170 § 7): the up
    # script exports it from the committed scripts/ruflo-seed/SEED-MANIFEST.sha256.
    # Default-empty (":-"), NOT required (":?"): compose interpolates the whole
    # file before it applies profiles, so a required variable here made every
    # "docker compose" invocation from this tree fail -- the dev profile, the
    # pre-commit and pre-push hooks -- whenever the digest was not exported
    # (measured 2026-09-23, A1.4). The refusal lives in the entrypoint instead:
    # it exits non-zero on an empty or non-64-hex digest, so a bare
    # "docker compose --profile ruflo up" without the up script yields a
    # visibly Restarting container, never a serving one.
    environment:
      - RUFLO_SEED_EXPECTED_DIGEST=${RUFLO_SEED_EXPECTED_DIGEST:-}
    volumes:
      - ruflo-data:/srv/ruflo
    # ADR-170 SS1's literal, verbatim, and the ONLY form the ADR gives.
    # This is NEVER what this container's own PID 1 execs -- see the header
    # comment above and scripts/ruflo-service-entrypoint.sh: `entrypoint:`
    # below always holds instead of running this. It is declared here so
    # `docker inspect`'s Config.Cmd carries the exact ADR-170 SS1 literal as
    # inspectable acceptance evidence (round-4 finding 6, ADR-170 SS1),
    # independent of what scripts/mcp-ruflo-launcher.sh separately runs
    # per-session via `docker exec`.
    command: ['node', '/opt/ruflo-seed/node_modules/@claude-flow/cli/bin/cli.js', 'mcp', 'start']
    # scripts/ruflo-service-entrypoint.sh is this container's real PID 1: it
    # validates the installed seed candidate digest against
    # RUFLO_SEED_EXPECTED_DIGEST above (never a build-time manifest record --
    # ADR-170 SS7 round-4 finding 2: nothing inside the image is authority),
    # proves /srv/ruflo (and its three derived-state subdirectories) are
    # actually writable via write-and-remove probes (ADR-170 SS4: a bare
    # `mkdir -p` success proves nothing about writing into an EXISTING
    # read-only directory), prints the served CLI version, then holds
    # (H-2: via a TERM/INT trap around a backgrounded `sleep infinity`, not
    # a bare `exec sleep infinity` -- see the script's own header) -- it
    # deliberately never execs the trailing `command:` argv above (ADR-170
    # SS3/SS4/SS6). M-13: this COPY landed -- the Dockerfile's `ruflo` build
    # stage carries both
    # `COPY scripts/ruflo-service-entrypoint.sh /opt/ruflo-service-entrypoint.sh`
    # and `COPY scripts/ruflo-seed/manifest.mjs /opt/ruflo-manifest/generate-manifest.mjs`
    # (confirmed by direct read, 2026-09-23) -- deliberately NOT a bind mount
    # here: ADR-170 SS6 states the only mount this service carries is the
    # data volume above, and a bind mount of even one repo file would
    # contradict that.
    entrypoint: ['/bin/sh', '/opt/ruflo-service-entrypoint.sh']
    profiles:
      - ruflo

volumes:
  node_modules:
    # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
    # can distinguish a Skillsmith-owned `<project>_node_modules` volume from
    # another repo's generically-shaped `node_modules` volume sharing the same
    # Compose conventions. Applies at creation time only -- Compose does not
    # recreate an existing named volume when its label config changes, so this
    # does not disturb any currently-live worktree's volume.
    labels:
      app.skillsmith.owned: 'true'
  # SMI-5957 correction #5: one named volume per workspace package, backing
  # the per-package node_modules mounts declared on `dev` and `test` above.
  # Same SMI-5750 ownership-label rationale as the root node_modules volume.
  cli-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  core-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  doc-retrieval-mcp-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  enterprise-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  mcp-server-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  skillsmith-cli-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  vscode-extension-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  website-node-modules:
    labels:
      app.skillsmith.owned: 'true'
  # SMI-6192: named volume for packages/website/.vercel (the @astrojs/vercel
  # adapter's git-ignored build output) -- see docs/internal/implementation/
  # smi-6192-website-vercel-output-eacces.md. No explicit `driver:` key,
  # matching every other base-file named volume above (implicit `local`).
  website-vercel-output:
    labels:
      app.skillsmith.owned: 'true'
  # ADR-170 SS8: external:true (never a bare `name:`-only declaration --
  # SS8's own measured hazard is that a `name:`-only volume is deleted by
  # ANY declaring project's `down -v`, including an unrelated worktree's
  # teardown; `external: true` is measured, not assumed, to survive that:
  # ADR-170 SS8's arm V-ext). This is why it is NOT grouped with the
  # `app.skillsmith.owned`-labelled volumes above: Compose refuses
  # `labels:`/other creation-time keys on an `external: true` volume, since
  # Compose itself never creates or removes it -- scripts/ruflo-service-up.sh
  # creates it exactly once (ADR-170 SS5's instance-nonce Docker volume
  # label is applied by that script's own `docker volume create --label`,
  # not by Compose).
  ruflo-data:
    external: true
    name: skillsmith-ruflo-data
