services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
      # can distinguish a Skillsmith-built `<project>-dev` image from another
      # repo's generically-shaped `dev` service image sharing the same Compose
      # conventions. Applies at build time only -- pre-existing images stay
      # unlabeled (report-only "UNCONFIRMED ownership" until --include-unlabeled).
      labels:
        app.skillsmith.owned: 'true'
    container_name: skillsmith-dev-1
    # SMI-5245: auto-recover the long-lived dev container after a Docker daemon /
    # machine restart so the doc-retrieval + skillsmith MCP servers (launched via
    # `docker exec` in .mcp.json) don't silently drop with a -32000 reconnect error.
    # `unless-stopped` (not `always`): honors an explicit `docker stop` / `compose
    # down` so the CLAUDE.md recovery flows that rely on `down` staying down still
    # work. dev-only — `test` runs one-shot commands and must not loop.
    restart: unless-stopped
    ports:
      - '${DEV_PORT:-3001}:3001'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # SMI-4677: bind host Claude Code memory dir read-only for the
      # doc-retrieval-mcp memory-topic-files adapter. Source path uses
      # ${HOME} (resolved host-side at compose-parse time) +
      # ${SKILLSMITH_PROJECT_DIR_ENCODED} (per-contributor; see .env.schema).
      # The `:-` empty-default is intentional (SMI-4910): contributors without
      # a .env get a silent (warning-free) blank rather than a Compose WARN.
      # Bind always succeeds; if the source dir doesn't exist, Docker creates
      # an empty mount and the adapter's existsSync guard skips it gracefully.
      # Test profile omits this bind by design (CI runners have no host memory dir).
      - ${HOME}/.claude/projects/${SKILLSMITH_PROJECT_DIR_ENCODED:-}/memory:/skillsmith-memory:ro
      # SMI-5793: bind host ~/.skillsmith read-write so the reindex CLI
      # (running inside this container via .husky/post-commit's `docker exec`)
      # can persist its structured log + reindex.state to a host-visible path
      # instead of the container's own throwaway filesystem. Read-write,
      # unlike the memory-dir mount above, since this direction WRITES.
      # dev-only — `test` never runs reindex (assertNotInCi() guards it
      # unconditionally) and has no host ~/.skillsmith to bind anyway.
      - ${HOME}/.skillsmith:/skillsmith-state
    environment:
      - NODE_ENV=development
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # SMI-4677: tells doc-retrieval-mcp memory-topic-files adapter to
      # bypass its homedir()-derived path resolution and read from the
      # bind-mounted dir above instead.
      - SKILLSMITH_MEMORY_DIR_OVERRIDE=/skillsmith-memory
      # SMI-5793: tells the reindex CLI's state/log-path resolvers
      # (reindex-state.ts's resolveReindexStateDir(), rotation.ts's
      # getLogDir()) to write to the bind-mounted path above instead of
      # homedir()-derived /root/.skillsmith (the container's own throwaway
      # home, invisible on the host).
      - SKILLSMITH_STATE_DIR_OVERRIDE=/skillsmith-state
    entrypoint: ['/app/docker-entrypoint.sh']
    command: tail -f /dev/null
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - dev

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: skillsmith-test-1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=test
    entrypoint: ['/app/docker-entrypoint.sh']
    command: npm test
    healthcheck:
      test: ['CMD', 'node', '-e', "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - test

volumes:
  node_modules:
    # SMI-5750: positive ownership marker so prune-orphaned-docker-volumes.sh
    # can distinguish a Skillsmith-owned `<project>_node_modules` volume from
    # another repo's generically-shaped `node_modules` volume sharing the same
    # Compose conventions. Applies at creation time only -- Compose does not
    # recreate an existing named volume when its label config changes, so this
    # does not disturb any currently-live worktree's volume.
    labels:
      app.skillsmith.owned: 'true'
